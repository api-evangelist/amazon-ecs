openapi: 3.1.0
info:
  title: 'Amazon ECS Amazon Elastic Container Service (ECS) Capacity Providers #X Amz Target=AmazonEC2ContainerServiceV20141113.UpdateService API'
  description: Amazon Elastic Container Service (Amazon ECS) is a fully managed container orchestration service that makes it easy to deploy, manage, and scale containerized applications. The Amazon ECS API uses an RPC model where all actions are routed to a single endpoint via POST with an X-Amz-Target header specifying the action. This specification models the core ECS resource operations for clusters, services, tasks, and task definitions.
  version: '3.1'
  contact:
    name: Amazon Web Services
    url: https://aws.amazon.com/ecs/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-apisguru-categories:
  - cloud
  x-logo:
    url: https://aws.amazon.com/favicon.ico
  x-origin:
  - format: openapi
    url: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/Welcome.html
servers:
- url: https://ecs.{region}.amazonaws.com
  description: Amazon ECS regional endpoint
  variables:
    region:
      default: us-east-1
      description: AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - eu-north-1
      - ap-southeast-1
      - ap-southeast-2
      - ap-northeast-1
      - ap-northeast-2
      - ap-south-1
      - sa-east-1
      - ca-central-1
security:
- aws_sig_v4: []
tags:
- name: '#X Amz Target=AmazonEC2ContainerServiceV20141113.UpdateService'
paths:
  /#X-Amz-Target=AmazonEC2ContainerServiceV20141113.UpdateService:
    post:
      operationId: UpdateService
      summary: Amazon Ecs Update an Ecs Service
      description: Modifies the parameters of a service. Changes take effect in a rolling update fashion depending on the deployment configuration.
      tags:
      - '#X Amz Target=AmazonEC2ContainerServiceV20141113.UpdateService'
      externalDocs:
        url: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_UpdateService.html
      parameters:
      - $ref: '#/components/parameters/X-Amz-Target'
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              type: object
              required:
              - service
              properties:
                cluster:
                  type: string
                  description: The short name or full ARN of the cluster hosting the service.
                service:
                  type: string
                  description: The name or ARN of the service to update.
                taskDefinition:
                  type: string
                  description: The family and revision or full ARN of the task definition.
                desiredCount:
                  type: integer
                  description: The number of instantiations of the task to place and keep running.
                deploymentConfiguration:
                  $ref: '#/components/schemas/DeploymentConfiguration'
                networkConfiguration:
                  $ref: '#/components/schemas/NetworkConfiguration'
                capacityProviderStrategy:
                  type: array
                  items:
                    $ref: '#/components/schemas/CapacityProviderStrategyItem'
                placementConstraints:
                  type: array
                  items:
                    $ref: '#/components/schemas/PlacementConstraint'
                placementStrategy:
                  type: array
                  items:
                    $ref: '#/components/schemas/PlacementStrategy'
                platformVersion:
                  type: string
                  description: The platform version for Fargate tasks.
                forceNewDeployment:
                  type: boolean
                  description: Whether to force a new deployment of the service.
                healthCheckGracePeriodSeconds:
                  type: integer
                  description: Health check grace period in seconds.
                enableExecuteCommand:
                  type: boolean
                  description: Whether to enable Amazon ECS Exec.
                enableECSManagedTags:
                  type: boolean
                loadBalancers:
                  type: array
                  items:
                    $ref: '#/components/schemas/LoadBalancer'
                propagateTags:
                  type: string
                  enum:
                  - TASK_DEFINITION
                  - SERVICE
                  - NONE
                serviceConnectConfiguration:
                  $ref: '#/components/schemas/ServiceConnectConfiguration'
                serviceRegistries:
                  type: array
                  items:
                    $ref: '#/components/schemas/ServiceRegistry'
            examples:
              UpdateserviceRequestExample:
                summary: Default UpdateService request
                x-microcks-default: true
                value:
                  cluster: example_value
                  service: example_value
                  taskDefinition: example_value
                  desiredCount: 10
                  deploymentConfiguration:
                    deploymentCircuitBreaker:
                      enable: true
                      rollback: true
                    maximumPercent: 10
                    minimumHealthyPercent: 10
                    alarms:
                      alarmNames:
                      - {}
                      enable: true
                      rollback: true
                  networkConfiguration:
                    awsvpcConfiguration:
                      subnets:
                      - {}
                      securityGroups:
                      - {}
                      assignPublicIp: ENABLED
                  capacityProviderStrategy:
                  - capacityProvider: example_value
                    weight: 10
                    base: 10
                  placementConstraints:
                  - type: distinctInstance
                    expression: example_value
                  placementStrategy:
                  - type: random
                    field: example_value
                  platformVersion: example_value
                  forceNewDeployment: true
                  healthCheckGracePeriodSeconds: 10
                  enableExecuteCommand: true
                  enableECSManagedTags: true
                  loadBalancers:
                  - targetGroupArn: example_value
                    loadBalancerName: example_value
                    containerName: example_value
                    containerPort: 10
                  propagateTags: TASK_DEFINITION
                  serviceConnectConfiguration:
                    enabled: true
                    namespace: example_value
                    services:
                    - portName: example_value
                      discoveryName: example_value
                      clientAliases: {}
                      ingressPortOverride: 10
                      timeout: {}
                      tls: {}
                    logConfiguration:
                      logDriver: json-file
                      options: example_value
                      secretOptions:
                      - {}
                  serviceRegistries:
                  - registryArn: example_value
                    port: 10
                    containerName: example_value
                    containerPort: 10
      responses:
        '200':
          description: Service updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    $ref: '#/components/schemas/Service'
              examples:
                Updateservice200Example:
                  summary: Default UpdateService 200 response
                  x-microcks-default: true
                  value:
                    service:
                      serviceArn: example_value
                      serviceName: example_value
                      clusterArn: example_value
                      loadBalancers:
                      - {}
                      serviceRegistries:
                      - {}
                      status: ACTIVE
                      desiredCount: 10
                      runningCount: 10
                      pendingCount: 10
                      launchType: EC2
                      capacityProviderStrategy:
                      - {}
                      platformVersion: example_value
                      platformFamily: example_value
                      taskDefinition: example_value
                      deploymentConfiguration:
                        deploymentCircuitBreaker: {}
                        maximumPercent: 10
                        minimumHealthyPercent: 10
                        alarms: {}
                      deployments:
                      - {}
                      roleArn: example_value
                      events:
                      - id: abc123
                        createdAt: 42.5
                        message: example_value
                      createdAt: 42.5
                      placementConstraints:
                      - {}
                      placementStrategy:
                      - {}
                      networkConfiguration:
                        awsvpcConfiguration: {}
                      healthCheckGracePeriodSeconds: 10
                      schedulingStrategy: REPLICA
                      deploymentController:
                        type: ECS
                      tags:
                      - {}
                      createdBy: example_value
                      enableECSManagedTags: true
                      enableExecuteCommand: true
                      propagateTags: TASK_DEFINITION
        '400':
          $ref: '#/components/responses/ClientError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    DeploymentController:
      type: object
      properties:
        type:
          type: string
          description: The deployment controller type to use.
          enum:
          - ECS
          - CODE_DEPLOY
          - EXTERNAL
          example: ECS
    ServiceConnectConfiguration:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether Service Connect is enabled for this service.
          example: true
        namespace:
          type: string
          description: The namespace name or ARN of the Cloud Map namespace for the service.
          example: example_value
        services:
          type: array
          items:
            type: object
            properties:
              portName:
                type: string
              discoveryName:
                type: string
              clientAliases:
                type: array
                items:
                  type: object
                  properties:
                    port:
                      type: integer
                    dnsName:
                      type: string
              ingressPortOverride:
                type: integer
              timeout:
                type: object
                properties:
                  idleTimeoutSeconds:
                    type: integer
                  perRequestTimeoutSeconds:
                    type: integer
              tls:
                type: object
                properties:
                  issuerCertificateAuthority:
                    type: object
                    properties:
                      awsPcaAuthorityArn:
                        type: string
                  kmsKey:
                    type: string
                  roleArn:
                    type: string
          example: []
        logConfiguration:
          type: object
          properties:
            logDriver:
              type: string
              enum:
              - json-file
              - syslog
              - journald
              - gelf
              - fluentd
              - awslogs
              - splunk
              - awsfirelens
            options:
              type: object
              additionalProperties:
                type: string
            secretOptions:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  valueFrom:
                    type: string
          example: example_value
    Service:
      type: object
      description: Details on a service within a cluster. A service runs and maintains a specified number of instances of a task definition.
      properties:
        serviceArn:
          type: string
          description: The ARN that identifies the service.
          example: example_value
        serviceName:
          type: string
          description: The name of your service.
          example: example_value
        clusterArn:
          type: string
          description: The ARN of the cluster that hosts the service.
          example: example_value
        loadBalancers:
          type: array
          items:
            $ref: '#/components/schemas/LoadBalancer'
          example: []
        serviceRegistries:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRegistry'
          example: []
        status:
          type: string
          description: The status of the service.
          enum:
          - ACTIVE
          - DRAINING
          - INACTIVE
          example: ACTIVE
        desiredCount:
          type: integer
          description: The desired number of instantiations of the task definition to keep running on the service.
          example: 10
        runningCount:
          type: integer
          description: The number of tasks in the cluster that are in the RUNNING state.
          example: 10
        pendingCount:
          type: integer
          description: The number of tasks in the cluster that are in the PENDING state.
          example: 10
        launchType:
          type: string
          enum:
          - EC2
          - FARGATE
          - EXTERNAL
          example: EC2
        capacityProviderStrategy:
          type: array
          items:
            $ref: '#/components/schemas/CapacityProviderStrategyItem'
          example: []
        platformVersion:
          type: string
          example: example_value
        platformFamily:
          type: string
          example: example_value
        taskDefinition:
          type: string
          description: The task definition ARN used by tasks in the service.
          example: example_value
        deploymentConfiguration:
          $ref: '#/components/schemas/DeploymentConfiguration'
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
          example: []
        roleArn:
          type: string
          example: example_value
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              createdAt:
                type: number
              message:
                type: string
          example: []
        createdAt:
          type: number
          description: The Unix timestamp for when the service was created.
          example: 42.5
        placementConstraints:
          type: array
          items:
            $ref: '#/components/schemas/PlacementConstraint'
          example: []
        placementStrategy:
          type: array
          items:
            $ref: '#/components/schemas/PlacementStrategy'
          example: []
        networkConfiguration:
          $ref: '#/components/schemas/NetworkConfiguration'
        healthCheckGracePeriodSeconds:
          type: integer
          example: 10
        schedulingStrategy:
          type: string
          enum:
          - REPLICA
          - DAEMON
          example: REPLICA
        deploymentController:
          $ref: '#/components/schemas/DeploymentController'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          example: []
        createdBy:
          type: string
          example: example_value
        enableECSManagedTags:
          type: boolean
          example: true
        enableExecuteCommand:
          type: boolean
          example: true
        propagateTags:
          type: string
          enum:
          - TASK_DEFINITION
          - SERVICE
          - NONE
          example: TASK_DEFINITION
    NetworkConfiguration:
      type: object
      description: The network configuration for a task or service.
      properties:
        awsvpcConfiguration:
          type: object
          required:
          - subnets
          properties:
            subnets:
              type: array
              description: The IDs of the subnets associated with the task or service.
              items:
                type: string
            securityGroups:
              type: array
              description: The IDs of the security groups associated with the task or service.
              items:
                type: string
            assignPublicIp:
              type: string
              description: Whether the task's elastic network interface receives a public IP address.
              enum:
              - ENABLED
              - DISABLED
          example: example_value
    DeploymentConfiguration:
      type: object
      description: Deployment parameters that control how many tasks run during the deployment and the ordering of stopping and starting tasks.
      properties:
        deploymentCircuitBreaker:
          type: object
          properties:
            enable:
              type: boolean
              description: Whether to use the deployment circuit breaker logic.
            rollback:
              type: boolean
              description: Whether to roll back to the last completed deployment on failure.
          example: example_value
        maximumPercent:
          type: integer
          description: The upper limit (as a percentage of the service's desiredCount) of the number of running tasks that can be running during a deployment.
          example: 10
        minimumHealthyPercent:
          type: integer
          description: The lower limit (as a percentage of the service's desiredCount) of the number of running tasks that must remain running during a deployment.
          example: 10
        alarms:
          type: object
          properties:
            alarmNames:
              type: array
              items:
                type: string
            enable:
              type: boolean
            rollback:
              type: boolean
          example: example_value
    LoadBalancer:
      type: object
      properties:
        targetGroupArn:
          type: string
          description: The full ARN of the Elastic Load Balancing target group.
          example: example_value
        loadBalancerName:
          type: string
          description: The name of the load balancer (Classic Load Balancer only).
          example: example_value
        containerName:
          type: string
          description: The name of the container to associate with the load balancer.
          example: example_value
        containerPort:
          type: integer
          description: The port on the container to associate with the load balancer.
          example: 10
    CapacityProviderStrategyItem:
      type: object
      required:
      - capacityProvider
      properties:
        capacityProvider:
          type: string
          description: The short name of the capacity provider.
          example: example_value
        weight:
          type: integer
          description: The weight value designating the relative percentage of the total number of tasks launched that should use the capacity provider (0-1000).
          minimum: 0
          maximum: 1000
          example: 10
        base:
          type: integer
          description: The number of tasks, at a minimum, to run on the specified capacity provider (0-100000).
          minimum: 0
          maximum: 100000
          example: 10
    PlacementConstraint:
      type: object
      properties:
        type:
          type: string
          enum:
          - distinctInstance
          - memberOf
          description: The type of placement constraint.
          example: distinctInstance
        expression:
          type: string
          description: A cluster query language expression.
          example: example_value
    PlacementStrategy:
      type: object
      properties:
        type:
          type: string
          enum:
          - random
          - spread
          - binpack
          description: The type of placement strategy.
          example: random
        field:
          type: string
          description: The field to apply the placement strategy against.
          example: example_value
    Error:
      type: object
      properties:
        __type:
          type: string
          description: The error type.
          example: example_value
        message:
          type: string
          description: A human-readable description of the error.
          example: example_value
    ServiceRegistry:
      type: object
      properties:
        registryArn:
          type: string
          description: The ARN of the Cloud Map service registry.
          example: example_value
        port:
          type: integer
          example: 10
        containerName:
          type: string
          example: example_value
        containerPort:
          type: integer
          example: 10
    Tag:
      type: object
      properties:
        key:
          type: string
          description: The tag key (up to 128 characters).
          maxLength: 128
          example: example_value
        value:
          type: string
          description: The tag value (up to 256 characters).
          maxLength: 256
          example: example_value
    Deployment:
      type: object
      properties:
        id:
          type: string
          example: abc123
        status:
          type: string
          enum:
          - PRIMARY
          - ACTIVE
          - INACTIVE
          example: PRIMARY
        taskDefinition:
          type: string
          example: example_value
        desiredCount:
          type: integer
          example: 10
        pendingCount:
          type: integer
          example: 10
        runningCount:
          type: integer
          example: 10
        failedTasks:
          type: integer
          example: 10
        createdAt:
          type: number
          example: 42.5
        updatedAt:
          type: number
          example: 42.5
        launchType:
          type: string
          example: example_value
        platformVersion:
          type: string
          example: example_value
        platformFamily:
          type: string
          example: example_value
        networkConfiguration:
          $ref: '#/components/schemas/NetworkConfiguration'
        rolloutState:
          type: string
          enum:
          - COMPLETED
          - IN_PROGRESS
          - FAILED
          example: COMPLETED
        rolloutStateReason:
          type: string
          example: example_value
        capacityProviderStrategy:
          type: array
          items:
            $ref: '#/components/schemas/CapacityProviderStrategyItem'
          example: []
  parameters:
    X-Amz-Target:
      name: X-Amz-Target
      in: header
      required: true
      schema:
        type: string
      description: The target API action in the format AmazonEC2ContainerServiceV20141113.ActionName.
  responses:
    ServerError:
      description: Server error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ClientError:
      description: Client error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    aws_sig_v4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4 authentication.
externalDocs:
  description: Amazon ECS API Reference
  url: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/Welcome.html
