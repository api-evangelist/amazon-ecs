                      overrides:
                        containerOverrides: {}
                        cpu: example_value
                        memory: example_value
                        taskRoleArn: example_value
                        executionRoleArn: example_value
                        inferenceAcceleratorOverrides: {}
                      lastStatus: PROVISIONING
                      desiredStatus: RUNNING
                      cpu: example_value
                      memory: example_value
                      containers:
                      - {}
                      startedBy: example_value
                      version: 10
                      stoppedReason: example_value
                      stopCode: TaskFailedToStart
                      connectivity: CONNECTED
                      connectivityAt: 42.5
                      pullStartedAt: 42.5
                      pullStoppedAt: 42.5
                      executionStoppedAt: 42.5
                      createdAt: 42.5
                      startedAt: 42.5
                      stoppingAt: 42.5
                      stoppedAt: 42.5
                      group: example_value
                      launchType: EC2
                      platformVersion: example_value
                      platformFamily: example_value
                      capacityProviderName: example_value
                      availabilityZone: example_value
                      attachments:
                      - {}
                      healthStatus: HEALTHY
                      enableExecuteCommand: true
                      tags:
                      - {}
                      ephemeralStorage:
                        sizeInGiB: 10
                      inferenceAccelerators:
                      - {}
                      attributes:
                      - name: Example Title
                        value: example_value
                        targetType: example_value
                        targetId: '500123'
        '400':
