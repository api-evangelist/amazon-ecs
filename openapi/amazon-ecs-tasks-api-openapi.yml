  /#X-Amz-Target=AmazonEC2ContainerServiceV20141113.ExecuteCommand:
    post:
      operationId: ExecuteCommand
      summary: Amazon Ecs Execute a Command in a Running Container
      description: Runs a command remotely on a container within a task that is managed by Amazon ECS using AWS Systems Manager Session Manager.
      tags:
      - Tasks
      externalDocs:
        url: https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_ExecuteCommand.html
      parameters:
      - $ref: '#/components/parameters/X-Amz-Target'
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              type: object
              required:
              - command
              - interactive
              - task
              properties:
                cluster:
                  type: string
                container:
                  type: string
                  description: The name of the container to execute the command on. If not specified, the default container is used.
                command:
                  type: string
                  description: The command to run on the container.
                interactive:
                  type: boolean
                  description: Whether to run the command in interactive mode.
                task:
                  type: string
                  description: The task ID or full ARN of the task.
            examples:
              ExecutecommandRequestExample:
                summary: Default ExecuteCommand request
                x-microcks-default: true
                value:
                  cluster: example_value
                  container: example_value
                  command: example_value
                  interactive: true
                  task: example_value
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusterArn:
                    type: string
                  containerArn:
                    type: string
                  containerName:
                    type: string
                  interactive:
                    type: boolean
                  session:
                    type: object
                    properties:
                      sessionId:
                        type: string
                      streamUrl:
                        type: string
                      tokenValue:
                        type: string
                  taskArn:
                    type: string
              examples:
                Executecommand200Example:
                  summary: Default ExecuteCommand 200 response
                  x-microcks-default: true
                  value:
                    clusterArn: example_value
                    containerArn: example_value
                    containerName: example_value
                    interactive: true
                    session:
                      sessionId: '500123'
                      streamUrl: https://www.example.com
                      tokenValue: example_value
                    taskArn: example_value
        '400':
          $ref: '#/components/responses/ClientError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    TaskOverride:
      type: object
      description: The overrides associated with a task.
      properties:
        containerOverrides:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the container that receives the override.
              command:
                type: array
                items:
                  type: string
              environment:
                type: array
                items:
                  $ref: '#/components/schemas/KeyValuePair'
              environmentFiles:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                    type:
                      type: string
                      enum:
                      - s3
              cpu:
                type: integer
              memory:
                type: integer
              memoryReservation:
                type: integer
              resourceRequirements:
                type: array
