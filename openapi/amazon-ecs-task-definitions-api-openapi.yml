              type: object
              required:
              - credentialsParameter
              - domain
              properties:
                credentialsParameter:
                  type: string
                domain:
                  type: string
          example: example_value
    LinuxParameters:
      type: object
      properties:
        capabilities:
          type: object
          properties:
            add:
              type: array
              items:
                type: string
            drop:
              type: array
              items:
                type: string
          example: example_value
        devices:
          type: array
          items:
            type: object
            required:
            - hostPath
            properties:
              hostPath:
                type: string
              containerPath:
                type: string
              permissions:
                type: array
                items:
                  type: string
                  enum:
                  - read
                  - write
                  - mknod
          example: []
        initProcessEnabled:
          type: boolean
          description: Run an init process inside the container that forwards signals and reaps processes.
          example: true
        sharedMemorySize:
          type: integer
          description: The value for the size (in MiB) of the /dev/shm volume.
          example: 10
        tmpfs:
          type: array
          items:
            type: object
            required:
            - containerPath
            - size
            properties:
              containerPath:
                type: string
              size:
                type: integer
              mountOptions:
                type: array
                items:
                  type: string
          example: []
        maxSwap:
          type: integer
          description: The total amount of swap memory (in MiB) a container can use.
          example: 10
        swappiness:
          type: integer
          description: The container's memory swappiness behavior. A value of 0 prevents swapping; a value of 100 causes pages to be swapped aggressively.
          minimum: 0
          maximum: 100
          example: 10
    HealthCheck:
      type: object
      required:
      - command
      properties:
        command:
          type: array
          description: A string array representing the command that the container runs to determine if it is healthy. The first element is CMD or CMD-SHELL.
          items:
            type: string
          example: []
        interval:
          type: integer
          description: The time period in seconds between each health check execution (default 30).
          default: 30
          example: 10
        timeout:
          type: integer
          description: The time period in seconds to wait for a health check to succeed before it is considered a failure (default 5).
          default: 5
          example: 10
        retries:
          type: integer
          description: The number of times to retry a failed health check before the container is considered unhealthy (default 3).
          default: 3
          example: 10
        startPeriod:
          type: integer
          description: The optional grace period to provide containers time to bootstrap before failed health checks count towards the maximum retries (default 0).
          default: 0
          example: 10
