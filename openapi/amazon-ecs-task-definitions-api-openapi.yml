              type: string
              enum:
              - ENABLED
              - DISABLED
            transitEncryptionPort:
              type: integer
            authorizationConfig:
              type: object
              properties:
                accessPointId:
                  type: string
                iam:
                  type: string
                  enum:
                  - ENABLED
                  - DISABLED
          example: example_value
        fsxWindowsFileServerVolumeConfiguration:
          type: object
          required:
          - fileSystemId
          - rootDirectory
          - authorizationConfig
          properties:
            fileSystemId:
              type: string
            rootDirectory:
              type: string
