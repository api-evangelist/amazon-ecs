            type: string
          example: []
        interactive:
          type: boolean
          example: true
        pseudoTerminal:
          type: boolean
          example: true
        dockerLabels:
          type: object
          additionalProperties:
            type: string
          description: A key/value map of labels to add to the container.
          example: example_value
        ulimits:
          type: array
